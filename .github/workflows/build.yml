name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare runtime (portable Node + dsh closure)
        run: node scripts/prepare-runtime.mjs

      - name: Build installers (release)
        env:
          CARGO_BUILD_JOBS: 2
        run: pnpm --filter @dsh-desktop/desktop tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*
